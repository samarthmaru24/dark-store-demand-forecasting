[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#eef1f5"
textColor = "#0f172a"
borderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f8fafc"
baseRadius = "10px"
baseFontSize = 15
# Inter (text), Plus Jakarta Sans (headings and big numbers), JetBrains Mono (code only)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..600&display=swap"
headingFontSizes = ["2.2rem", "1.25rem", "1.05rem"]
headingFontWeights = [700, 650, 600]

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
